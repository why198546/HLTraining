# Supervisor配置模板
# 使用方法:
# 1. 安装supervisor: pip install supervisor
# 2. 复制此文件为 hltraining.conf
# 3. 修改路径为你的实际路径
# 4. sudo cp hltraining.conf /etc/supervisor/conf.d/
# 5. sudo supervisorctl reread
# 6. sudo supervisorctl update
# 7. sudo supervisorctl start hltraining

[program:hltraining]
command=/Users/hongyuwang/code/HLTraining/.venv/bin/python /Users/hongyuwang/code/HLTraining/app.py
directory=/Users/hongyuwang/code/HLTraining
user=hongyuwang
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/Users/hongyuwang/code/HLTraining/logs/app.log
stderr_logfile=/Users/hongyuwang/code/HLTraining/logs/error.log
environment=PATH="/Users/hongyuwang/code/HLTraining/.venv/bin"

# 停止信号
stopwaitsecs=10
stopsignal=TERM

# 重启策略
startretries=3
