<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片查看器测试</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    .test-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .generated-image-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #f5f5f5;
      aspect-ratio: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    
    .generated-image-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    
    .ai-image-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }
    
    .image-print-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      background: rgba(0, 98, 65, 0.9);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      z-index: 2;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .image-print-btn:hover {
      background: #00704a;
      transform: scale(1.1);
    }
    
    /* 图片查看器样式 */
    .image-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    
    .image-viewer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1;
      cursor: pointer;
    }
    
    .image-viewer-img {
      position: relative;
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      z-index: 2;
      cursor: zoom-out;
      user-select: none;
    }
    
    .image-viewer-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 40px;
      cursor: pointer;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .image-viewer-close:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.1);
    }
    
    .image-viewer-prev,
    .image-viewer-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .image-viewer-prev {
      left: 20px;
    }
    
    .image-viewer-next {
      right: 20px;
    }
    
    .image-viewer-prev:hover,
    .image-viewer-next:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-50%) scale(1.1);
    }
    
    .image-viewer-counter {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 20px;
    }
    
    .image-viewer-print {
      position: absolute;
      top: 20px;
      right: 80px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .image-viewer-print:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.1);
    }
    
    .console-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }
    
    .console-log {
      margin: 5px 0;
      padding: 2px 0;
    }
    
    .console-log.error {
      color: #f48771;
    }
    
    .console-log.warn {
      color: #dcdcaa;
    }
    
    .console-log.info {
      color: #569cd6;
    }
    
    .console-log.success {
      color: #6a9955;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🖼️ 图片查看器测试</h1>
    <p>点击任何一张图片进行测试。打印按钮不应该影响查看功能。</p>
    
    <div class="image-grid" id="imageGrid">
      <!-- 将由JavaScript生成 -->
    </div>
    
    <div class="console-output" id="console"></div>
  </div>

  <!-- 全屏图片查看器 -->
  <div id="image-viewer" class="image-viewer">
    <div class="image-viewer-overlay"></div>
    <button class="image-viewer-close">×</button>
    <button class="image-viewer-print" title="打印图片">🖨️</button>
    <button class="image-viewer-prev">‹</button>
    <button class="image-viewer-next">›</button>
    <div class="image-viewer-counter"></div>
    <img class="image-viewer-img" src="" alt="" />
  </div>

  <script>
    // 简单的控制台输出收集
    const consoleEl = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    function addConsoleOutput(message, type = 'log') {
      const logEl = document.createElement('div');
      logEl.className = `console-log ${type}`;
      logEl.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleEl.appendChild(logEl);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    console.log = function(...args) {
      originalLog(...args);
      addConsoleOutput(args.join(' '), 'info');
    };

    console.error = function(...args) {
      originalError(...args);
      addConsoleOutput(args.join(' '), 'error');
    };

    console.warn = function(...args) {
      originalWarn(...args);
      addConsoleOutput(args.join(' '), 'warn');
    };

    // 图片查看器对象
    const ImageViewer = {
      viewer: null,
      overlay: null,
      closeBtn: null,
      prevBtn: null,
      nextBtn: null,
      counter: null,
      img: null,
      printBtn: null,
      images: [],
      currentIndex: 0,
      touchStartX: 0,
      touchStartY: 0,
      lastClickTime: 0,

      init() {
        console.log('初始化图片查看器');
        
        this.viewer = document.getElementById('image-viewer');
        if (!this.viewer) {
          console.error('找不到 #image-viewer 元素');
          return;
        }
        
        this.overlay = this.viewer.querySelector('.image-viewer-overlay');
        this.closeBtn = this.viewer.querySelector('.image-viewer-close');
        this.printBtn = this.viewer.querySelector('.image-viewer-print');
        this.prevBtn = this.viewer.querySelector('.image-viewer-prev');
        this.nextBtn = this.viewer.querySelector('.image-viewer-next');
        this.counter = this.viewer.querySelector('.image-viewer-counter');
        this.img = this.viewer.querySelector('.image-viewer-img');

        if (!this.overlay || !this.closeBtn || !this.img) {
          console.error('图片查看器的某些元素未找到');
          return;
        }

        // 关闭按钮
        this.closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          console.log('点击关闭按钮');
          this.close();
        });
        
        this.overlay.addEventListener('click', (e) => {
          e.stopPropagation();
          console.log('点击背景');
          this.close();
        });
        
        // 打印按钮
        if (this.printBtn) {
          this.printBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('点击打印按钮');
            alert('打印功能');
          });
        }

        // 切换按钮
        if (this.prevBtn) {
          this.prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.navigate(-1);
          });
        }
        
        if (this.nextBtn) {
          this.nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.navigate(1);
          });
        }

        // 键盘导航
        document.addEventListener('keydown', (e) => {
          if (this.viewer.style.display === 'flex') {
            if (e.key === 'ArrowLeft') {
              e.preventDefault();
              this.navigate(-1);
            }
            if (e.key === 'ArrowRight') {
              e.preventDefault();
              this.navigate(1);
            }
            if (e.key === 'Escape') {
              e.preventDefault();
              this.close();
            }
          }
        });

        // 单击图片防止默认行为
        this.img.addEventListener('click', (e) => {
          e.stopPropagation();
          console.log('点击查看器中的图片');
        });

        // 双击关闭
        this.img.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          console.log('双击关闭查看器');
          this.close();
        });

        console.log('✓ 图片查看器初始化完成');
      },

      open(index) {
        console.log(`打开查看器，图片索引: ${index}`);
        
        if (!this.images || this.images.length === 0) {
          console.error('没有可查看的图片');
          return;
        }
        
        this.currentIndex = Math.min(index, this.images.length - 1);
        this.updateImage();
        
        setTimeout(() => {
          this.viewer.style.display = 'flex';
          document.body.style.overflow = 'hidden';
          console.log('✓ 查看器已显示');
        }, 0);
      },

      close() {
        console.log('关闭查看器');
        
        setTimeout(() => {
          this.viewer.style.display = 'none';
          document.body.style.overflow = '';
          this.currentIndex = 0;
          this.images = [];
          console.log('✓ 查看器已关闭');
        }, 0);
      },

      navigate(direction) {
        if (!this.images || this.images.length === 0) {
          console.warn('没有图片可导航');
          return;
        }
        
        const prevIndex = this.currentIndex;
        this.currentIndex = (this.currentIndex + direction + this.images.length) % this.images.length;
        
        if (prevIndex !== this.currentIndex) {
          console.log(`切换图片: ${prevIndex + 1} → ${this.currentIndex + 1}`);
          this.updateImage();
        }
      },

      updateImage() {
        try {
          if (!this.images || this.images.length === 0) {
            console.warn('没有图片可显示');
            return;
          }
          
          const currentSrc = this.images[this.currentIndex];
          if (!currentSrc) {
            console.error('无效的图片索引:', this.currentIndex);
            return;
          }
          
          this.img.src = currentSrc;
          this.counter.textContent = `${this.currentIndex + 1} / ${this.images.length}`;
          
          this.prevBtn.style.display = this.images.length > 1 ? 'flex' : 'none';
          this.nextBtn.style.display = this.images.length > 1 ? 'flex' : 'none';
          
          console.log(`已加载图片 ${this.currentIndex + 1}/${this.images.length}`);
        } catch (error) {
          console.error('更新图片时出错:', error);
        }
      },

      print() {
        console.log('打印图片:', this.images[this.currentIndex]);
      }
    };

    // 页面加载
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM加载完成');
      
      // 初始化查看器
      ImageViewer.init();
      
      // 生成测试图片
      const imageGrid = document.getElementById('imageGrid');
      const imageUrls = [
        'https://picsum.photos/200/200?random=1',
        'https://picsum.photos/200/200?random=2',
        'https://picsum.photos/200/200?random=3',
        'https://picsum.photos/200/200?random=4',
        'https://picsum.photos/200/200?random=5',
        'https://picsum.photos/200/200?random=6',
      ];
      
      imageUrls.forEach((url, index) => {
        const item = document.createElement('div');
        item.className = 'generated-image-item';
        item.innerHTML = `
          <img src="${url}" alt="测试图片 ${index + 1}" class="ai-image-thumbnail" />
          <button class="image-print-btn" onclick="event.stopPropagation(); alert('打印: ${index + 1}')">🖨️</button>
        `;
        imageGrid.appendChild(item);
      });
      
      // 图片点击委托事件
      document.addEventListener('click', (e) => {
        const thumbnail = e.target.closest('.ai-image-thumbnail');
        if (!thumbnail) return;
        
        e.preventDefault();
        e.stopPropagation();
        
        console.log('点击了图片缩略图');
        
        const allImages = document.querySelectorAll('.ai-image-thumbnail');
        if (allImages.length === 0) {
          console.warn('没有找到任何图片');
          return;
        }
        
        ImageViewer.images = Array.from(allImages).map(img => img.src);
        ImageViewer.currentIndex = Array.from(allImages).indexOf(thumbnail);
        
        console.log(`打开查看器 - 图片索引: ${ImageViewer.currentIndex}/${ImageViewer.images.length}`);
        
        if (ImageViewer.currentIndex >= 0 && ImageViewer.currentIndex < ImageViewer.images.length) {
          ImageViewer.open(ImageViewer.currentIndex);
        }
      }, false);
      
      console.log('✓ 页面初始化完成');
    });
  </script>
</body>
</html>
