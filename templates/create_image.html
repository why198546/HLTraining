<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松果AI - 2D图片创作</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #00704A 0%, #008C54 100%);
            min-height: 100vh;
        }
    </style>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/core.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/page-create-image.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/toast.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    {% include 'components/header.html' %}

    <main class="main-content create-image-page">
        <div class="container">
            <!-- 页面标题 -->
            <div class="page-header">
                <h1><i class="fas fa-lightbulb"></i> 描述你的创意</h1>
                <p>用文字描述你的想法，或上传线稿图片作为参考</p>
            </div>

            <!-- 创作输入区域 -->
            <div class="creation-input-area">
                <!-- 上传的图片预览（可选） -->
                <div id="uploaded-image-preview" class="image-preview" style="display: none;">
                    <div class="preview-header">
                        <span><i class="fas fa-image"></i> 参考图片</span>
                        <button class="remove-image-btn" onclick="removeUploadedImage()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <img id="uploaded-image" src="" alt="上传的参考图片">
                </div>

                <!-- 文字输入框 -->
                <div class="prompt-input-container">
                    <div class="input-wrapper">
                        <textarea id="creation-prompt" class="creation-input"
                            placeholder="例如：一只可爱的小猫咪，戴着红色的帽子，坐在彩虹上...&#10;&#10;你可以只用文字描述，也可以上传图片作为参考！"
                            rows="4"></textarea>
                        <div class="action-buttons">
                            <button class="add-image-btn" onclick="startVoiceInput(event)" title="语音输入">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button class="add-image-btn" onclick="triggerImageUpload()" title="添加图片">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <input type="file" id="reference-image" accept="image/*" style="display: none;"
                            onchange="handleImageUpload(event)">
                    </div>
                    <div class="input-hint">
                        💡 <strong>创作小贴士：</strong>可以描述颜色、形状、表情、背景等细节，或上传线稿图片
                    </div>
                </div>

                <!-- 语音录音指示器 -->
                <div class="voice-recording-indicator" id="voice-recording-indicator" style="display: none;">
                    <div class="voice-wave-animation">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <div class="voice-status-text">正在听你说话...</div>
                    <div class="voice-tip">说完后点击麦克风停止</div>
                </div>

                <!-- 风格选择 -->
                <div class="generation-options">
                    <div class="option-group">
                        <label>图片风格：</label>
                        <select id="image-style" class="style-select">
                            <option value="cute">可爱卡通</option>
                            <option value="realistic">写实风格</option>
                            <option value="anime">动漫风格</option>
                            <option value="fantasy">奇幻风格</option>
                            <option value="model_3d">3D模型专用</option>
                            <option value="none">不加修饰</option>
                        </select>
                    </div>
                    <div class="option-group" style="display: none;">
                        <label>色彩偏好：</label>
                        <select id="color-preference" class="style-select">
                            <option value="colorful">色彩丰富</option>
                            <option value="pastel">柔和色调</option>
                            <option value="bright">明亮鲜艳</option>
                            <option value="natural">自然色彩</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>分辨率：</label>
                        <select id="aspect-ratio" class="style-select">
                            <option value="512x512">512×512 (1:1) 推荐</option>
                            <option value="768x512">768×512 (3:2) 横屏</option>
                            <option value="512x768">512×768 (2:3) 竖屏</option>
                            <option value="1024x576">1024×576 (16:9) 横屏</option>
                            <option value="576x1024">576×1024 (9:16) 竖屏</option>
                            <option value="1024x1024">1024×1024 (1:1)</option>
                        </select>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button class="btn-primary btn-large" id="generate-btn" onclick="generateImage()">
                    <i class="fas fa-magic"></i> 开始生成
                </button>
            </div>

            <!-- 生成结果区域 -->
            <div class="result-section" id="result-section" style="display: none;">
                <div class="result-container">
                    <div class="result-image">
                        <img id="generated-img" alt="生成的图片">
                    </div>
                </div>

                <!-- 快速调整 -->
                <div class="adjust-section">
                    <h4><i class="fas fa-sliders-h"></i> 快速调整</h4>
                    <div class="adjust-buttons">
                        <button class="adjust-btn" onclick="quickAdjust('brighter')">
                            <i class="fas fa-sun"></i> 更明亮
                        </button>
                        <button class="adjust-btn" onclick="quickAdjust('vibrant')">
                            <i class="fas fa-palette"></i> 更鲜艳
                        </button>
                        <button class="adjust-btn" onclick="quickAdjust('soft')">
                            <i class="fas fa-cloud"></i> 更柔和
                        </button>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="btn-secondary" onclick="saveArtwork()">
                        <i class="fas fa-save"></i> 保存作品
                    </button>
                    <button class="btn-primary" onclick="goTo3D()">
                        <i class="fas fa-cube"></i> 生成3D模型
                    </button>
                    <button class="btn-primary" onclick="goToVideo()">
                        <i class="fas fa-video"></i> 生成视频
                    </button>
                </div>
            </div>

            <!-- 热门角色提示词 -->
            <div class="prompt-examples">
                <h4><i class="fas fa-lightbulb"></i> 热门角色提示词</h4>
                <div class="examples-grid">
                    <div class="example-card"
                        onclick="fillPrompt('一个勇敢的奥特曼战士，身穿银色和红色战斗服，胸前有彩色计时器，双手摆出战斗姿势，背景是蓝天白云')">
                        <div class="example-icon">🦸‍♂️</div>
                        <h5>奥特曼</h5>
                        <p>勇敢的宇宙战士</p>
                    </div>
                    <div class="example-card"
                        onclick="fillPrompt('汪汪队的Chase警犬，穿着蓝色警察制服，戴着警帽，坐在警车旁边，表情认真专注')">
                        <div class="example-icon">🐕‍🦺</div>
                        <h5>汪汪队</h5>
                        <p>英勇的救援小狗</p>
                    </div>
                    <div class="example-card"
                        onclick="fillPrompt('名侦探柯南，穿着蓝色西装和红色领结，戴着眼镜，手持放大镜，表情聪明自信')">
                        <div class="example-icon">🔍</div>
                        <h5>柯南</h5>
                        <p>聪明的小侦探</p>
                    </div>
                    <div class="example-card"
                        onclick="fillPrompt('皮卡丘，黄色的身体，红色脸颊，尖尖的耳朵，可爱的大眼睛，开心的笑容')">
                        <div class="example-icon">⚡</div>
                        <h5>皮卡丘</h5>
                        <p>电气小精灵</p>
                    </div>
                    <div class="example-card"
                        onclick="fillPrompt('HelloKitty，白色的小猫咪，粉色的蝴蝶结，圆圆的大眼睛，甜美的笑容')">
                        <div class="example-icon">🎀</div>
                        <h5>HelloKitty</h5>
                        <p>可爱的小猫咪</p>
                    </div>
                    <div class="example-card"
                        onclick="fillPrompt('超级马里奥，红色帽子和衣服，蓝色背带裤，棕色胡子，跳跃的姿势')">
                        <div class="example-icon">🍄</div>
                        <h5>马里奥</h5>
                        <p>超级水管工</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading遮罩 -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loading-text">正在生成图片...</p>
        </div>
    </div>

    <!-- 隐藏字段传递session_id -->
    <input type="hidden" id="session-id" value="{{ session_id or '' }}">

    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/voice-input.js') }}"></script>
    <script src="{{ url_for('static', filename='js/create_image.js') }}"></script>
</body>
</html>
