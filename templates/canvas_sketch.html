<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>手绘画布 - 松鼠艺术</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎨</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gpu-acceleration.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/canvas_sketch.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    {% include 'components/auth_header.html' %}
    
    <div class="sketch-container">
        <!-- 顶部控制栏 -->
        <div class="control-bar">
            <div class="project-info">
                <button id="backToProjects" class="btn-back" title="返回项目列表">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <input type="text" id="projectTitle" class="project-title-input" value="{{ project_title if project_title and project_title != '手绘项目' else '' }}" placeholder="项目标题（保存时自动生成）">
                <button id="saveProjectBtn" class="btn-save">
                    <i class="fas fa-save"></i> 保存项目
                </button>
            </div>
            
            <div class="resolution-selector">
                <label>分辨率：</label>
                <select id="resolutionSelect">
                    <option value="512x512" selected>512×512 (1:1)</option>
                    <option value="768x512">768×512 (3:2)</option>
                    <option value="512x768">512×768 (2:3)</option>
                    <option value="1024x576">1024×576 (16:9)</option>
                    <option value="576x1024">576×1024 (9:16)</option>
                    <option value="1024x1024">1024×1024 (1:1)</option>
                </select>
                <button id="applyResolution" class="btn-primary">应用分辨率</button>
            </div>
            
            <div class="prompt-input-container">
                <input type="text" id="promptInput" placeholder="输入提示词描述你想要生成的图片...">
                <button id="generateBtn" class="btn-generate">
                    <i class="fas fa-magic"></i> 生成图片
                </button>
            </div>
        </div>

        <!-- 画布和工具栏 -->
        <div class="canvas-section">
            <!-- 左上角操作按钮 -->
            <div class="top-left-controls">
                <button id="undoBtn" class="control-btn" title="撤销">
                    <i class="fas fa-undo"></i>
                </button>
                <button id="redoBtn" class="control-btn" title="重做">
                    <i class="fas fa-redo"></i>
                </button>
                <button id="clearBtn" class="control-btn danger" title="清空">
                    <i class="fas fa-trash"></i>
                </button>
                <button id="fullscreenBtn" class="control-btn" title="全屏">
                    <i class="fas fa-expand"></i>
                </button>
                <div class="zoom-controls">
                    <button id="zoomOutBtn" class="control-btn" title="缩小">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <span id="zoomLevel" class="zoom-level">100%</span>
                    <button id="zoomInBtn" class="control-btn" title="放大">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button id="zoomResetBtn" class="control-btn" title="重置">
                        <i class="fas fa-compress-arrows-alt"></i>
                    </button>
                </div>
            </div>

            <!-- 左侧工具栏 -->
            <div class="left-toolbar">
                <button class="toolbar-toggle" data-target="left">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="toolbar-content">
                <!-- 笔触类型 -->
                <div class="tool-section">
                    <label><i class="fas fa-circle"></i> 笔触</label>
                    <div class="brush-type-buttons">
                        <button id="roundBtn" class="brush-type-btn active" title="圆形">
                            <div class="brush-preview round"></div>
                        </button>
                        <button id="squareBtn" class="brush-type-btn" title="方形">
                            <div class="brush-preview square"></div>
                        </button>
                    </div>
                </div>
                
                <!-- 画笔大小 -->
                <div class="tool-section">
                    <label><i class="fas fa-text-height"></i> 大小</label>
                    <div class="range-container">
                        <input type="range" id="brushSize" min="1" max="100" value="5" step="1">
                        <span id="brushSizeValue" class="value-display">5</span>
                    </div>
                    <div class="size-presets">
                        <button class="preset-btn" data-size="2">极细</button>
                        <button class="preset-btn" data-size="5">细</button>
                        <button class="preset-btn" data-size="10">中</button>
                        <button class="preset-btn" data-size="20">粗</button>
                        <button class="preset-btn" data-size="40">极粗</button>
                    </div>
                </div>

                <!-- 快速颜色选择 -->
                <div class="tool-section">
                    <label><i class="fas fa-fill-drip"></i> 颜色</label>
                    <div class="color-palette">
                        <button class="color-btn" data-color="#000000" style="background: #000000;"></button>
                        <button class="color-btn" data-color="#FFFFFF" style="background: #FFFFFF; border: 1px solid #ddd;"></button>
                        <button class="color-btn" data-color="#FF0000" style="background: #FF0000;"></button>
                        <button class="color-btn" data-color="#FF6B00" style="background: #FF6B00;"></button>
                        <button class="color-btn" data-color="#FFD700" style="background: #FFD700;"></button>
                        <button class="color-btn" data-color="#00FF00" style="background: #00FF00;"></button>
                        <button class="color-btn" data-color="#0000FF" style="background: #0000FF;"></button>
                        <button class="color-btn" data-color="#8B00FF" style="background: #8B00FF;"></button>
                        <button class="color-btn" data-color="#FF1493" style="background: #FF1493;"></button>
                        <button class="color-btn" data-color="#8B4513" style="background: #8B4513;"></button>
                        <button class="color-btn" data-color="#808080" style="background: #808080;"></button>
                        <button class="color-btn" data-color="#87CEEB" style="background: #87CEEB;"></button>
                    </div>
                    <div class="custom-color-container">
                        <input type="color" id="brushColor" value="#000000">
                        <div id="colorHistory" class="color-history"></div>
                    </div>
                </div>
                </div>
            </div>

            <!-- 右侧工具栏 -->
            <div class="right-toolbar">
                <button class="toolbar-toggle" data-target="right">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div class="toolbar-content">
                <!-- 透明度 -->
                <div class="tool-section">
                    <label><i class="fas fa-adjust"></i> 透明度</label>
                    <div class="range-container">
                        <input type="range" id="brushOpacity" min="0" max="100" value="100">
                        <span id="brushOpacityValue" class="value-display">100</span>%
                    </div>
                </div>

                <!-- 形状工具 -->
                <div class="tool-section">
                    <label><i class="fas fa-shapes"></i> 形状</label>
                    <div class="shape-buttons">
                        <button id="lineBtn" class="shape-btn" title="直线">
                            <i class="fas fa-minus"></i>
                        </button>
                        <button id="rectBtn" class="shape-btn" title="矩形">
                            <i class="far fa-square"></i>
                        </button>
                        <button id="circleBtn" class="shape-btn" title="圆形">
                            <i class="far fa-circle"></i>
                        </button>
                        <button id="arrowBtn" class="shape-btn" title="箭头">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
                
                <!-- 橡皮擦 -->
                <div class="tool-section">
                    <button id="eraserBtn" class="tool-btn">
                        <i class="fas fa-eraser"></i> 橡皮擦
                    </button>
                </div>
                </div>
            </div>
            
            <div class="canvas-wrapper" id="canvasWrapper">
                <div class="canvas-box" id="canvasBox">
                    <!-- 第1层：白色背景层 -->
                    <div class="white-background" id="whiteBackground"></div>
                    <!-- 第2层：生成的图片层 -->
                    <img id="generatedBackground" class="generated-background" src="" alt="" style="display: none;">
                    <!-- 第3层：透明画布层（手绘线条） -->
                    <canvas id="sketchCanvas"></canvas>
                    <div class="canvas-hint">在这里手绘你的草图作为参考图...</div>
                </div>
            </div>
            
            <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
        </div>

        <!-- 结果展示区域 -->
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-header">
                <h3>生成结果</h3>
                <div class="view-mode-selector">
                    <button id="overlayModeBtn" class="view-mode-btn active">
                        <i class="fas fa-layer-group"></i> 叠放编辑
                    </button>
                    <button id="sideBySideBtn" class="view-mode-btn">
                        <i class="fas fa-columns"></i> 并排对比
                    </button>
                    <button id="hideModeBtn" class="view-mode-btn">
                        <i class="fas fa-eye-slash"></i> 隐藏结果
                    </button>
                </div>
            </div>

            <!-- 并排对比模式 -->
            <div class="side-by-side-view" id="sideBySideView" style="display: none;">
                <div class="image-panel">
                    <h4>手绘草图</h4>
                    <img id="sketchImageSide" src="" alt="手绘草图">
                </div>
                <div class="image-panel">
                    <h4>AI生成</h4>
                    <img id="generatedImageSide" src="" alt="AI生成图片">
                </div>
            </div>

            <!-- 叠加对比控制 -->
            <div class="overlay-controls" id="overlayControls" style="display: none;">
                <div class="control-row">
                    <label>
                        <input type="checkbox" id="toggleSketchLayer" checked> 显示手绘线条
                    </label>
                    <label>
                        <input type="checkbox" id="toggleGeneratedLayer" checked> 显示生成图片
                    </label>
                </div>
                <div class="control-row">
                    <label>生成图片透明度：</label>
                    <input type="range" id="generatedOpacitySlider" min="0" max="100" value="80">
                    <span id="opacityValue">80</span>%
                </div>
                <div class="control-row">
                    <label>对比滑块：</label>
                    <input type="range" id="compareSlider" min="0" max="100" value="100">
                    <span id="compareValue">100</span>%
                </div>
            </div>

            <!-- 提示文字 -->
            <div class="overlay-hint" id="overlayHint">
                <p><i class="fas fa-info-circle"></i> 生成的图片已放置在画布底层，您可以继续在上面手绘调整，然后重新生成</p>
            </div>

            <div class="result-actions">
                <button id="regenerateBtn" class="btn-action btn-primary">
                    <i class="fas fa-sync-alt"></i> 重新生成
                </button>
                <button id="clearBackgroundBtn" class="btn-action">
                    <i class="fas fa-eraser"></i> 清除背景图
                </button>
                <button id="downloadGeneratedBtn" class="btn-action">
                    <i class="fas fa-download"></i> 下载生成图
                </button>
                <button id="saveToGalleryBtn" class="btn-action btn-primary">
                    <i class="fas fa-save"></i> 保存到作品集
                </button>
                <button id="newSketchBtn" class="btn-action">
                    <i class="fas fa-plus"></i> 新建画布
                </button>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>AI正在生成图片，请稍候...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/canvas_sketch.js') }}"></script>
    <script>
        // 项目管理相关变量
        const projectId = {{ project_id if project_id else 'null' }};
        const isNewProject = {{ 'true' if is_new else 'false' }};
        
        // 返回项目列表
        document.getElementById('backToProjects').addEventListener('click', () => {
            window.location.href = '/canvas/projects';
        });
        
        // 保存项目
        document.getElementById('saveProjectBtn').addEventListener('click', async () => {
            let title = document.getElementById('projectTitle').value.trim();
            const canvas = document.getElementById('sketchCanvas');
            const prompt = document.getElementById('promptInput').value.trim();
            
            // 如果是新项目且没有标题，尝试生成标题
            if (isNewProject && !title && prompt) {
                try {
                    const genResponse = await fetch('/canvas/projects/generate-title', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({prompt: prompt, type: 'sketch'})
                    });
                    const genData = await genResponse.json();
                    if (genData.success && genData.title) {
                        title = genData.title;
                        document.getElementById('projectTitle').value = title;
                    }
                } catch (e) {
                    console.log('标题生成失败，使用默认标题');
                }
            }
            
            if (!title) {
                title = '未命名项目';
                document.getElementById('projectTitle').value = title;
            }
            
            try {
                // 生成缩略图
                const thumbnail = canvas.toDataURL('image/png');
                
                // 准备画布数据
                const canvasData = {
                    imageDataUrl: canvas.toDataURL('image/png'),
                    generatedImageUrl: window.generatedImageDataUrl || null,
                    prompt: document.getElementById('promptInput').value
                };
                
                const response = await fetch('/canvas/projects/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        project_id: projectId,
                        title: title,
                        project_type: 'sketch',
                        thumbnail: thumbnail,
                        canvas_data: canvasData,
                        width: canvas.width,
                        height: canvas.height
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('项目保存成功！');
                    // 如果是新项目，更新URL
                    if (!projectId) {
                        window.history.pushState({}, '', `/canvas/sketch?project_id=${data.project_id}`);
                        window.location.reload();
                    }
                } else {
                    alert('保存失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败');
            }
        });
        
        // 加载项目
        if (projectId) {
            fetch(`/canvas/projects/${projectId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.canvas_data) {
                        const canvasData = data.canvas_data;
                        const canvas = document.getElementById('sketchCanvas');
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        
                        // 加载画布图片
                        if (canvasData.imageDataUrl) {
                            const img = new Image();
                            img.onload = () => {
                                ctx.drawImage(img, 0, 0);
                                saveState(); // 保存初始状态到历史记录
                            };
                            img.src = canvasData.imageDataUrl;
                        }
                        
                        // 加载生成的图片
                        if (canvasData.generatedImageUrl) {
                            window.generatedImageDataUrl = canvasData.generatedImageUrl;
                            const genImg = new Image();
                            genImg.onload = () => {
                                const genCtx = document.getElementById('generatedCanvas').getContext('2d');
                                genCtx.drawImage(genImg, 0, 0);
                            };
                            genImg.src = canvasData.generatedImageUrl;
                        }
                        
                        // 加载提示词
                        if (canvasData.prompt) {
                            document.getElementById('promptInput').value = canvasData.prompt;
                        }
                    }
                })
                .catch(err => console.error('加载项目失败:', err));
        }
    </script>
</body>
</html>
