<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容类型图标测试</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #f5f7fa;
            padding: 2rem;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .demo-card {
            position: relative;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .demo-card-title {
            text-align: center;
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-section">
            <h2>📊 内容类型图标展示</h2>
            <p>图标位于卡片左下角，高亮表示包含该类型内容，淡显表示不包含</p>
        </div>

        <div class="test-section">
            <h2>🎨 各种组合示例</h2>
            <div class="demo-grid">
                <!-- 仅图片 -->
                <div class="demo-card">
                    <div class="demo-card-title">仅图片</div>
                    <div class="content-type-indicators">
                        <div class="type-indicator active" title="包含图片">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="type-indicator inactive" title="无3D模型">
                            <i class="fas fa-cube"></i>
                        </div>
                        <div class="type-indicator inactive" title="无视频">
                            <i class="fas fa-video"></i>
                        </div>
                    </div>
                </div>

                <!-- 图片 + 3D模型 -->
                <div class="demo-card">
                    <div class="demo-card-title">图片 + 3D模型</div>
                    <div class="content-type-indicators">
                        <div class="type-indicator active" title="包含图片">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="type-indicator active" title="包含3D模型">
                            <i class="fas fa-cube"></i>
                        </div>
                        <div class="type-indicator inactive" title="无视频">
                            <i class="fas fa-video"></i>
                        </div>
                    </div>
                </div>

                <!-- 图片 + 视频 -->
                <div class="demo-card">
                    <div class="demo-card-title">图片 + 视频</div>
                    <div class="content-type-indicators">
                        <div class="type-indicator active" title="包含图片">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="type-indicator inactive" title="无3D模型">
                            <i class="fas fa-cube"></i>
                        </div>
                        <div class="type-indicator active" title="包含视频">
                            <i class="fas fa-video"></i>
                        </div>
                    </div>
                </div>

                <!-- 全部都有 -->
                <div class="demo-card">
                    <div class="demo-card-title">完整内容（图片+3D+视频）</div>
                    <div class="content-type-indicators">
                        <div class="type-indicator active" title="包含图片">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="type-indicator active" title="包含3D模型">
                            <i class="fas fa-cube"></i>
                        </div>
                        <div class="type-indicator active" title="包含视频">
                            <i class="fas fa-video"></i>
                        </div>
                    </div>
                </div>

                <!-- 仅3D模型 -->
                <div class="demo-card">
                    <div class="demo-card-title">仅3D模型</div>
                    <div class="content-type-indicators">
                        <div class="type-indicator inactive" title="无图片">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="type-indicator active" title="包含3D模型">
                            <i class="fas fa-cube"></i>
                        </div>
                        <div class="type-indicator inactive" title="无视频">
                            <i class="fas fa-video"></i>
                        </div>
                    </div>
                </div>

                <!-- 仅视频 -->
                <div class="demo-card">
                    <div class="demo-card-title">仅视频</div>
                    <div class="content-type-indicators">
                        <div class="type-indicator inactive" title="无图片">
                            <i class="fas fa-image"></i>
                        </div>
                        <div class="type-indicator inactive" title="无3D模型">
                            <i class="fas fa-cube"></i>
                        </div>
                        <div class="type-indicator active" title="包含视频">
                            <i class="fas fa-video"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2>🎨 颜色说明</h2>
            <ul style="line-height: 2;">
                <li><strong style="color: #8b5cf6;">紫色</strong> - 图片内容（fa-image）</li>
                <li><strong style="color: #3b82f6;">蓝色</strong> - 3D模型（fa-cube）</li>
                <li><strong style="color: #ec4899;">粉色</strong> - 视频内容（fa-video）</li>
                <li><strong style="color: #94a3b8;">灰色淡显</strong> - 不包含该类型内容</li>
            </ul>
        </div>

        <div class="test-section">
            <h2>✨ 交互效果</h2>
            <p>鼠标悬停在图标上可以查看提示信息（tooltip），高亮图标会有放大效果</p>
        </div>
    </div>
</body>
</html>
