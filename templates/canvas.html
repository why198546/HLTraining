<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI画布 - 松鼠艺术</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/canvas.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    {% include 'components/auth_header.html' %}
    
    <div class="canvas-container">
        <!-- 左侧画布区域 -->
        <div class="canvas-gallery">
            <div class="canvas-header">
                <h2>我的画布</h2>
                <div class="canvas-actions">
                    <button class="btn-icon" id="clearCanvas" title="清空画布">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="downloadAll" title="下载全部">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="canvas-grid" id="canvasGrid">
                <!-- 初始提示 -->
                <div class="empty-canvas">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                    </svg>
                    <p>画布为空</p>
                    <p class="hint">在右侧对话框中描述你想要的图片</p>
                </div>
            </div>
        </div>
        
        <!-- 右侧对话区域 -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="chat-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
                    </svg>
                    <span>AI创作助手</span>
                </div>
                <button class="btn-icon" id="clearChat" title="清空对话">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/>
                        <line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                </button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-content">
                        <p>你好！我是AI创作助手 🎨</p>
                        <p>我可以帮你：</p>
                        <ul>
                            <li>💬 <strong>聊天交流</strong> - 询问创作建议、技巧等</li>
                            <li>🎨 <strong>生成新图片</strong> - 详细描述你想要的图片</li>
                            <li>✨ <strong>修改图片</strong> - 点击左侧图片后告诉我如何修改</li>
                        </ul>
                        <p class="hint-text">试试问我："帮我画一只可爱的小松鼠"</p>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <form id="chatForm" class="chat-input-form">
                    <!-- 命令菜单 -->
                    <div class="command-menu" id="commandMenu">
                        <div class="command-item" data-command="生成">
                            <span class="command-icon">🎨</span>
                            <div class="command-info">
                                <div class="command-name">/生成</div>
                                <div class="command-desc">生成新图片</div>
                            </div>
                        </div>
                        <div class="command-item" data-command="对话">
                            <span class="command-icon">💬</span>
                            <div class="command-info">
                                <div class="command-name">/对话</div>
                                <div class="command-desc">与AI交流</div>
                            </div>
                        </div>
                        <div class="command-item" data-command="修改">
                            <span class="command-icon">✨</span>
                            <div class="command-info">
                                <div class="command-name">/修改</div>
                                <div class="command-desc">修改选中图片</div>
                            </div>
                        </div>
                    </div>
                    
                    <textarea 
                        id="promptInput" 
                        placeholder="输入 / 查看命令，或直接描述你的需求..." 
                        rows="3"
                        maxlength="1000"
                    ></textarea>
                    <div class="input-actions">
                        <div class="char-count">
                            <span id="charCount">0</span>/1000
                        </div>
                        <button type="submit" class="btn-send" id="sendBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                            <span>发送</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 图片预览模态框 -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img id="modalImage" src="" alt="预览">
            <div class="modal-actions">
                <button class="btn-modal" id="downloadImage">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    下载
                </button>
                <button class="btn-modal" id="deleteImage">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                    删除
                </button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/canvas.js') }}?v=9"></script>
</body>
</html>
