<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成课程二维码 - 慧乐培训</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #00704A 0%, #008C54 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-gold {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            color: #333;
            font-weight: bold;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #FFA500 0%, #FFD700 100%);
            color: #000;
        }
        .qr-result {
            display: none;
            margin-top: 20px;
        }
        .qr-image {
            max-width: 300px;
            border: 3px solid #00704A;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.3);
            color: white;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <a href="{{ url_for('auth.teacher_dashboard') }}" class="back-link">
            <i class="fas fa-arrow-left me-2"></i>返回教师后台
        </a>
        
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0"><i class="fas fa-qrcode me-2"></i>生成课程二维码</h3>
            </div>
            <div class="card-body">
                <form id="qrForm">
                    <div class="mb-3">
                        <label class="form-label">课程类型</label>
                        <select class="form-select" name="course_type" required>
                            <option value="">请选择课程类型</option>
                            <option value="trial_course">体验课（赠送50 token）</option>
                            <option value="formal_course">正式课程（升级为正式学生，每天30 token）</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">课程名称</label>
                        <select class="form-select" name="course_name" required>
                            <option value="">请选择课程</option>
                            {% for key, title in lessons.items() %}
                            <option value="{{ key }}">{{ title }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">从松果课堂选择课程</small>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">使用次数限制（选填）</label>
                            <input type="number" class="form-control" name="max_uses" min="1" placeholder="留空表示无限制">
                            <small class="text-muted">限制此二维码可以被多少人使用</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">有效天数（选填）</label>
                            <input type="number" class="form-control" name="expires_days" min="1" placeholder="留空表示永久有效">
                            <small class="text-muted">二维码在多少天后过期</small>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">课程描述（选填）</label>
                        <textarea class="form-control" name="description" rows="2" placeholder="简要描述此课程或二维码用途"></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-gold btn-lg w-100">
                        <i class="fas fa-magic me-2"></i>生成二维码
                    </button>
                </form>
                
                <div id="qrResult" class="qr-result text-center">
                    <h4 class="text-success mb-3">二维码生成成功！</h4>
                    <img id="qrImage" class="qr-image mb-3" alt="课程二维码">
                    <div class="alert alert-info">
                        <p class="mb-2"><strong>课程信息：</strong></p>
                        <p id="courseInfo" class="mb-2"></p>
                        <p class="mb-2"><strong>使用限制：</strong></p>
                        <p id="usageLimits" class="mb-2 small"></p>
                        <p class="mb-2"><strong>扫描链接：</strong></p>
                        <p id="scanUrl" class="small text-break"></p>
                    </div>
                    <div class="btn-group w-100">
                        <a id="downloadBtn" class="btn btn-success" download>
                            <i class="fas fa-download me-2"></i>下载二维码
                        </a>
                        <a href="{{ url_for('qr.list_qrcodes') }}" class="btn btn-primary">
                            <i class="fas fa-list me-2"></i>查看所有二维码
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title"><i class="fas fa-info-circle me-2"></i>使用说明</h5>
                <ul class="list-unstyled">
                    <li class="mb-2">
                        <i class="fas fa-check text-success me-2"></i>
                        <strong>体验课二维码：</strong>学生扫描后获得50个token，但不能使用3D和视频功能
                    </li>
                    <li class="mb-2">
                        <i class="fas fa-check text-success me-2"></i>
                        <strong>正式课程二维码：</strong>学生扫描后升级为正式学生，每天自动获得30个token，可使用所有功能
                    </li>
                    <li class="mb-2">
                        <i class="fas fa-check text-success me-2"></i>
                        生成的二维码可以打印或分享给学生扫描
                    </li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('qrForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const response = await fetch('{{ url_for("qr.generate_qrcode") }}', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                // 显示结果
                document.getElementById('qrImage').src = data.qr_url;
                document.getElementById('downloadBtn').href = data.qr_url;
                
                const courseTypeText = data.course_type === 'trial_course' ? '体验课' : '正式课程';
                document.getElementById('courseInfo').textContent = 
                    `${data.course_name || '未命名课程'} (${courseTypeText})`;
                
                // 显示使用限制
                const usageLimits = `使用次数：${data.max_uses} | 有效期至：${data.expires_at}`;
                document.getElementById('usageLimits').textContent = usageLimits;
                
                document.getElementById('scanUrl').textContent = data.scan_url;
                
                document.getElementById('qrResult').style.display = 'block';
                
                // 滚动到结果区域
                document.getElementById('qrResult').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert('生成失败：' + data.error);
            }
        });
    </script>
</body>
</html>
