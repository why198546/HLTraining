{# 统一的作品模态框组件 - 用于gallery和my_artworks页面 #}

<!-- 作品详情模态框 -->
<div id="artworkModal" class="artwork-modal">
    <div class="artwork-modal-content">
        <div class="artwork-modal-header">
            <button class="artwork-modal-close">&times;</button>
            <h2 id="modalArtworkTitle" class="editable-title" contenteditable="false">作品标题</h2>
            <button id="editTitleBtn" class="edit-title-btn" title="编辑标题" style="display: none;">
                <i class="fas fa-edit"></i>
            </button>
        </div>
        <div class="artwork-modal-body">
            <div class="artwork-detail-showcase" id="modalArtworkShowcase">
                <!-- 动态内容 -->
            </div>
            <div class="artwork-detail-info" id="modalArtworkInfo">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>
</div>

<!-- 图片放大查看模态框 -->
<div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <div class="image-modal-backdrop"></div>
    <div class="image-modal-content" onclick="event.stopPropagation()">
        <button class="image-modal-close" onclick="closeImageModal()">&times;</button>
        <img id="fullImage" src="" alt="">
        <div class="image-modal-title" id="imageModalTitle"></div>
    </div>
</div>

<!-- 图片右键菜单 -->
<div id="imageContextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" data-action="continue">
        <i class="fas fa-paint-brush"></i> 继续创作
    </div>
    <div class="context-menu-item" data-action="generate-model">
        <i class="fas fa-cube"></i> 生成3D模型
    </div>
    <div class="context-menu-item" data-action="generate-video">
        <i class="fas fa-video"></i> 生成视频
    </div>
</div>

<!-- 3D模型查看器 -->
<div id="modelOverlay" class="model-overlay" onclick="closeModelModal()">
    <div class="model-overlay-backdrop"></div>
    <div class="model-viewer-container" onclick="event.stopPropagation()">
        <div class="model-header">
            <h3 id="modelTitle">3D模型查看器</h3>
            <button class="model-close-btn" onclick="closeModelModal()">&times;</button>
        </div>
        <div id="modelContainer" class="model-container">
            <!-- Canvas for 3D model -->
            <canvas id="modelCanvas"></canvas>
            <!-- 模型信息显示 -->
            <div id="modelInfo" style="position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; z-index: 10;">
                准备加载3D模型...
            </div>
            <!-- 模型加载状态 -->
            <div id="modelLoading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; display: none;">
                <p>加载中...</p>
            </div>
        </div>
    </div>
</div>
