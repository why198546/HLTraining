{# 统一的作品相关JavaScript加载 - 用于gallery和my_artworks页面 #}

<!-- 统一的作品模态框功能 -->
<script src="{{ url_for('static', filename='js/artwork-modal.js') }}"></script>
<!-- 评论功能模块 -->
<script src="{{ url_for('static', filename='js/comments.js') }}"></script>
