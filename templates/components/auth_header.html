<!-- 认证页面专用导航栏 -->
<header class="header">
    <nav class="navbar">
        <a class="nav-brand" href="{{ url_for('main.index') }}" aria-label="AI松果之术">
            <span class="nav-logo-text">
                <img
                    src="{{ url_for('static', filename='image/static-logo-horizontal.png') }}"
                    alt="AI松果之术"
                    class="nav-logo-img"
                    loading="lazy"
                    onerror="this.style.display='none'; this.parentElement.querySelector('.logo-text-fallback').style.display='inline-block';"
                >
                <span class="logo-text-fallback">AI松果之术</span>
            </span>
        </a>
        <ul class="nav-menu">
            <li><a href="{{ url_for('main.index') }}" class="nav-link">首页</a></li>
            <li><a href="{{ url_for('create.create') }}" class="nav-link">开始创作</a></li>
            <li class="nav-dropdown">
                <a href="#" class="nav-link">AI画布 <i class="fas fa-chevron-down"></i></a>
                <ul class="dropdown-menu">
                    <li><a href="{{ url_for('canvas.canvas') }}">经典版</a></li>
                    <li><a href="{{ url_for('canvas.canvas_infinite') }}">无限画布</a></li>
                </ul>
            </li>
            <li><a href="{{ url_for('gallery.gallery') }}" class="nav-link">作品展示</a></li>
            <li><a href="{{ url_for('main.tutorial') }}" class="nav-link">使用教程</a></li>
            {% if current_user.is_authenticated %}
                <li><a href="{{ url_for('auth.my_artworks') }}" class="nav-link">我的作品</a></li>
                <li class="nav-dropdown">
                    <a href="#" class="nav-link">{{ current_user.nickname }} <i class="fas fa-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="{{ url_for('auth.profile') }}">我的资料</a></li>
                        <li><a href="{{ url_for('auth.logout') }}">退出登录</a></li>
                    </ul>
                </li>
            {% else %}
                <li><a href="{{ url_for('auth.login') }}" class="nav-link {{ 'active' if request.endpoint == 'auth.login' }}">登录</a></li>
                <li><a href="{{ url_for('auth.register') }}" class="nav-link btn-primary {{ 'active' if request.endpoint == 'auth.register' }}">免费注册</a></li>
            {% endif %}
        </ul>
        <div class="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>
</header>

<!-- 导航栏JavaScript -->
<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
