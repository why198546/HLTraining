<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松果AI - 儿童版</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    {% include 'components/header.html' %}

    <!-- 全屏GIF引导页 -->
    <div id="splash" class="splash" aria-hidden="false">
        <img src="{{ url_for('static', filename='image/banner.gif') }}" alt="松果AI 欢迎动画" class="splash-gif" id="splash-gif">
    </div>

    <main id="main-content" style="display:none;">
        <!-- 首页介绍 -->
        <section id="home" class="hero">
            <div class="hero-content">
                <img src="{{ url_for('static', filename='image/banner.gif') }}" alt="松果AI 动画" class="hero-banner hero-banner-large">
                <h1 class="hero-title">欢迎来到松果AI！</h1>
                <p class="hero-subtitle">让AI帮你将创意变为现实，简单几步创作精美作品</p>

                <!-- 课程入口、练习入口、作品展示、松果简介 -->
                <div class="hero-actions">
                    <a class="hero-card hero-course" href="{{ url_for('tutorial') }}">
                        <span class="card-icon"><i class="fas fa-book-open"></i></span>
                        <span class="card-title">课程入口</span>
                        <span class="card-desc">从入门到进阶的AI课程</span>
                    </a>
                    <a class="hero-card hero-practice" href="{{ url_for('create') }}">
                        <span class="card-icon"><i class="fas fa-pencil-alt"></i></span>
                        <span class="card-title">练习入口</span>
                        <span class="card-desc">上传线稿，开始AI创作练习</span>
                    </a>
                    <a class="hero-card hero-gallery" href="{{ url_for('gallery') }}">
                        <span class="card-icon"><i class="fas fa-images"></i></span>
                        <span class="card-title">作品展示</span>
                        <span class="card-desc">浏览大家的精彩AI作品</span>
                    </a>
                    <a class="hero-card hero-about" href="#about">
                        <span class="card-icon"><i class="fas fa-info-circle"></i></span>
                        <span class="card-title">松果简介</span>
                        <span class="card-desc">了解松果AI与项目特色</span>
                    </a>
                </div>
                
                <!-- 功能介绍卡片（已移除，根据需求隐藏） -->
                
                <!-- 中间部分仅保留四个入口，移除CTA按钮 -->
            </div>
        </section>

        <!-- 作品展示区域移除，仅保留中间部分 -->
                

            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>关于我们</h4>
                    <p>AI创意工坊致力于让儿童通过有趣的方式学习和体验AI技术。</p>
                </div>
                <div class="footer-section">
                    <h4>功能特色</h4>
                    <ul>
                        <li>简笔画智能上色</li>
                        <li>3D模型自动生成</li>
                        <li>手办风格转换</li>
                        <li>AI技术学习</li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>联系我们</h4>
                    <p>如有问题或建议，请联系我们的技术支持团队。</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 AI创意工坊. 专为10-14岁儿童设计.</p>
            </div>
        </div>
    </footer>

    <!-- 加载Three.js用于3D模型展示 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- 主要JavaScript文件 -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
