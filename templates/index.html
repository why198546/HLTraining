<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松果AI - 儿童版</title>
    
    <!-- 关键CSS内联 - 防止闪烁 -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #00704A 0%, #008C54 100%);
        }
    </style>
    
    <!-- 模块化CSS：核心 + 首页专用 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/core.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/page-home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gpu-acceleration.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    {% include 'components/header.html' %}

    <!-- 全屏GIF引导页 -->
    <div id="splash" class="splash" aria-hidden="false">
        <img src="{{ url_for('static', filename='image/banner.gif') }}" alt="松果AI 欢迎动画" class="splash-gif" id="splash-gif">
    </div>

    <main id="main-content" style="display:none;">
        <!-- 首页介绍 -->
        <section id="home" class="hero">
            <div class="hero-content">
                <img src="{{ url_for('static', filename='image/static-logo-vertical-full.png') }}" alt="松果AI Logo" class="hero-logo-main">

                <!-- 三个入口卡片：松果课堂、松果创意、松果生活 -->
                <div class="hero-actions">
                    <a class="hero-card hero-course" href="{{ url_for('main.sunguo_class') }}">
                        <span class="card-icon"><i class="fas fa-book-open"></i></span>
                        <span class="card-title">松果课堂</span>
                        <span class="card-desc">美术+AI主题课程，分人物、动作、场景、综合四大板块</span>
                    </a>
                    <a class="hero-card hero-practice" href="{{ url_for('create.create_image') }}">
                        <span class="card-icon"><i class="fas fa-pencil-alt"></i></span>
                        <span class="card-title">松果创意</span>
                        <span class="card-desc">文字描述或上传线稿，开始AI创作之旅</span>
                    </a>
                    <a class="hero-card hero-gallery" href="{{ url_for('gallery.gallery') }}">
                        <span class="card-icon"><i class="fas fa-images"></i></span>
                        <span class="card-title">松果生活</span>
                        <span class="card-desc">浏览大家的精彩AI作品</span>
                    </a>
                </div>
                
                <!-- 功能介绍卡片（已移除，根据需求隐藏） -->
                
                <!-- 中间部分仅保留四个入口，移除CTA按钮 -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>关于我们</h4>
                    <p>AI创意工坊致力于让儿童通过有趣的方式学习和体验AI技术。</p>
                </div>
                <div class="footer-section">
                    <h4>功能特色</h4>
                    <ul>
                        <li>简笔画智能上色</li>
                        <li>3D模型自动生成</li>
                        <li>手办风格转换</li>
                        <li>AI技术学习</li>
                    </ul>
                </div>
                
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 AI创意工坊. 专为10-14岁儿童设计.</p>
            </div>
        </div>
    </footer>

    <!-- 加载Three.js用于3D模型展示 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- GPU优化器 -->
    <script src="{{ url_for('static', filename='js/gpu-optimizer.js') }}"></script>
    
    <!-- 主要JavaScript文件 -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
