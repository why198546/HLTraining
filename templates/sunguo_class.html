<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>松果课堂 - 松果AI</title>
  
  <!-- 关键CSS内联 - 防止闪烁 -->
  <style>
    body { margin: 0; padding: 0; background: linear-gradient(135deg, #00704A 0%, #008C54 100%); }
  </style>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/core.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/page-classroom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gpu-acceleration.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  {% include 'components/header.html' %}

  <main class="classroom-page">
    <div class="classroom-container">
      <h1 class="classroom-title">松果课堂</h1>
      <p class="classroom-subtitle">选择课程类型，开始学习之旅</p>

      <div class="classroom-nav-actions" style="max-width: 600px; margin-top: 60px;">
        <!-- 松果体验课 -->
        <a class="hero-card hero-trial" href="{{ url_for('main.sunguo_trial_courses') }}">
          <span class="card-icon"><i class="fas fa-sparkles"></i></span>
          <span class="card-title">松果体验课</span>
          <span class="card-desc">4 节趣味课程，快速上手 AI 绘画</span>
        </a>

        <!-- 正式课程 -->
        <a class="hero-card hero-formal" href="{{ url_for('main.sunguo_formal_courses') }}">
          <span class="card-icon"><i class="fas fa-graduation-cap"></i></span>
          <span class="card-title">松果正式课</span>
          <span class="card-desc">系统学习 AI 绘画提示词设计与优化</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
