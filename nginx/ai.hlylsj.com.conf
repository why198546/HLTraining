# HLTraining Nginx配置
# 儿童AI创作平台 - 生产环境

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name ai.hlylsj.com;
    
    # 重定向所有HTTP请求到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS配置
server {
    listen 443 ssl http2;
    server_name ai.hlylsj.com;

    # SSL证书配置（使用通配符证书）
    ssl_certificate      /etc/nginx/ssl/hlylsj.com/wildcard.fullchain.cer;
    ssl_certificate_key  /etc/nginx/ssl/hlylsj.com/wildcard.key;

    # SSL安全配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:32m;
    ssl_session_tickets off;

    # 现代化的SSL协议和密码套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 日志配置
    access_log /var/log/nginx/hltraining_access.log;
    error_log /var/log/nginx/hltraining_error.log warn;

    # 客户端上传限制（16MB，匹配Flask配置）
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # 根路径代理到Gunicorn
    location / {
        # 代理到Flask应用
        proxy_pass http://127.0.0.1:8080;
        
        # 代理头配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 静态文件直接由Nginx提供（性能优化）
    location /static/ {
        alias /var/www/hltraining/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # 压缩静态文件
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;
    }

    # 用户上传文件
    location /uploads/ {
        alias /var/www/hltraining/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        
        # 安全：不允许执行脚本
        location ~ \.(php|py|sh|pl)$ {
            deny all;
        }
    }

    # 创作会话文件
    location /creation_sessions/ {
        alias /var/www/hltraining/creation_sessions/;
        expires 7d;
        add_header Cache-Control "public";
        
        # 安全：不允许执行脚本
        location ~ \.(php|py|sh|pl)$ {
            deny all;
        }
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/hltraining/static/favicon.ico;
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        alias /var/www/hltraining/static/robots.txt;
        log_not_found off;
        access_log off;
    }

    # 健康检查端点（不记录日志）
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 拒绝访问敏感文件
    location ~ /(\.env|\.git|\.gitignore|requirements\.txt|.*\.py$) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
