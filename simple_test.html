<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试</title>
</head>
<body>
    <h1>简单点击测试</h1>
    <button onclick="testClick()">测试点击</button>
    <button onclick="generateVideo()">测试 generateVideo</button>
    <div id="output"></div>

    <script>
        function testClick() {
            console.log('✅ 基本点击功能正常');
            document.getElementById('output').innerHTML = '✅ 基本点击功能正常';
        }
        
        // 模拟必要的全局变量
        let generatedImageUrl = '/uploads/test-image.jpg';
        window.inlineVersionManager = { currentSessionId: 'test-session-123' };
        
        function showMessage(message, type) {
            console.log(`${type}: ${message}`);
            alert(`${type}: ${message}`);
        }
    </script>
    
    <!-- 加载create.js -->
    <script src="/static/js/create.js"></script>
    
    <script>
        // 检查函数是否被正确加载
        setTimeout(() => {
            console.log('检查函数...');
            console.log('typeof generateVideo:', typeof generateVideo);
            console.log('typeof showVideoConfigModal:', typeof showVideoConfigModal);
            
            if (typeof generateVideo === 'function') {
                document.getElementById('output').innerHTML += '<br>✅ generateVideo 函数存在';
            } else {
                document.getElementById('output').innerHTML += '<br>❌ generateVideo 函数不存在';
            }
        }, 500);
    </script>
</body>
</html>
