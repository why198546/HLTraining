<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图片裁剪工具测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .test-section {
            margin: 30px 0;
        }
        
        .test-section h2 {
            color: #FF8C00;
            border-bottom: 2px solid #FF8C00;
            padding-bottom: 10px;
        }
        
        .file-input {
            padding: 10px;
            margin: 10px 0;
        }
        
        input[type="file"] {
            padding: 10px;
        }
        
        button {
            background: #FF8C00;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        
        button:hover {
            background: #e67e00;
        }
        
        #preview {
            max-width: 100%;
            margin: 20px 0;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .preview-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        
        .info-box {
            background: #f9f9f9;
            border-left: 4px solid #FF8C00;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
        
        .success {
            color: #4CAF50;
        }
        
        .error {
            color: #f44336;
        }
        
        .steps {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        
        .step-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 图片裁剪工具测试</h1>
        <p style="text-align: center; color: #666;">
            这是一个独立的测试页面，用于演示改进的自动边界检测、角点拖拽和手动绘制功能
        </p>
    </div>
    
    <!-- 功能演示 -->
    <div class="container test-section">
        <h2>📋 功能介绍</h2>
        <div class="info-box">
            <h3>✨ 新功能</h3>
            <ul>
                <li><strong>自动边界检测:</strong> 智能识别图片中的纸张、屏幕或文档边界</li>
                <li><strong>拖拽角点调整:</strong> 用鼠标拖拽四个角的标记点来微调边界</li>
                <li><strong>手动绘制模式:</strong> 点击4个角来手动定义裁剪区域</li>
                <li><strong>实时预览:</strong> 显示裁剪区域的半透明遮挡</li>
            </ul>
        </div>
    </div>
    
    <!-- 文件上传 -->
    <div class="container test-section">
        <h2>📁 上传图片</h2>
        <div class="file-input">
            <input type="file" id="imageInput" accept="image/*" />
            <p style="color: #999; font-size: 12px;">
                💡 选择一张包含纸张、屏幕或文档的照片进行测试
            </p>
        </div>
    </div>
    
    <!-- 预览区域 -->
    <div class="container">
        <h2>👁️ 预览</h2>
        <div id="previewContainer" class="preview-container" style="display: none;">
            <img id="preview" src="" alt="预览" />
        </div>
        <p id="preview-placeholder" style="text-align: center; color: #999;">
            上传图片后，预览将显示在这里...
        </p>
    </div>
    
    <!-- 测试控件 -->
    <div class="container test-section">
        <h2>🎮 控制</h2>
        <div class="steps">
            <button class="step-btn" onclick="testAutoDetect()" style="display: none;" id="autoBtn">
                🎯 自动检测边界
            </button>
            <button class="step-btn" onclick="testManualMode()" style="display: none;" id="manualBtn">
                🖱️ 手动绘制模式
            </button>
            <button class="step-btn" onclick="resetPreview()" style="display: none;" id="resetBtn">
                🔄 重置
            </button>
        </div>
        <div id="statusMessage" class="info-box" style="display: none;"></div>
    </div>
    
    <!-- 测试结果 -->
    <div class="container">
        <h2>📊 测试结果</h2>
        <div id="results" style="color: #666;">
            <p>等待上传图片...</p>
        </div>
    </div>
    
    <script>
        // 全局变量
        let currentImage = null;
        let currentMode = null;  // 'auto' 或 'manual'
        
        // 获取DOM元素
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const preview = document.getElementById('preview');
        const statusMessage = document.getElementById('statusMessage');
        const results = document.getElementById('results');
        const autoBtn = document.getElementById('autoBtn');
        const manualBtn = document.getElementById('manualBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 文件选择事件
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    preview.src = img.src;
                    previewContainer.style.display = 'block';
                    document.getElementById('preview-placeholder').style.display = 'none';
                    
                    // 显示控制按钮
                    autoBtn.style.display = 'inline-block';
                    manualBtn.style.display = 'inline-block';
                    resetBtn.style.display = 'inline-block';
                    
                    // 清除之前的结果
                    showResults(`✅ 已上传图片: ${file.name}<br/>尺寸: ${img.width}x${img.height}px`);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        
        // 自动检测模式
        function testAutoDetect() {
            if (!currentImage) {
                showStatus('请先上传图片', 'error');
                return;
            }
            
            currentMode = 'auto';
            showStatus('🎯 自动检测边界...', 'info');
            
            // 模拟边界检测结果
            const detectedBorder = simulateBoundaryDetection(currentImage);
            
            drawBoundaryOnImage(detectedBorder);
            showResults(`
                ✅ 自动检测完成<br/>
                <strong>检测到的边界:</strong><br/>
                上: ${Math.round(detectedBorder.top)}px<br/>
                下: ${Math.round(detectedBorder.bottom)}px<br/>
                左: ${Math.round(detectedBorder.left)}px<br/>
                右: ${Math.round(detectedBorder.right)}px<br/>
                <br/>
                <strong>提示:</strong> 可以拖拽四个角来微调边界
            `);
        }
        
        // 手动绘制模式
        function testManualMode() {
            if (!currentImage) {
                showStatus('请先上传图片', 'error');
                return;
            }
            
            currentMode = 'manual';
            showStatus('🖱️ 点击图片的4个角（按顺序：左上 → 右上 → 右下 → 左下）', 'info');
            showResults('正在等待用户输入...');
        }
        
        // 重置
        function resetPreview() {
            preview.style.filter = 'none';
            preview.style.cursor = 'default';
            currentMode = null;
            statusMessage.style.display = 'none';
            showResults(`✅ 已重置 (图片: ${currentImage.width}x${currentImage.height}px)`);
        }
        
        // 模拟边界检测
        function simulateBoundaryDetection(img) {
            // 简单的模拟：检测结果取决于图片大小和内容
            // 在实际应用中，这会调用真实的detectPaperBoundary函数
            
            const margin = Math.min(img.width, img.height) * 0.08;
            
            return {
                top: margin,
                bottom: img.height - margin,
                left: margin,
                right: img.width - margin
            };
        }
        
        // 绘制边界
        function drawBoundaryOnImage(border) {
            // 创建SVG overlay
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', `0 0 ${currentImage.width} ${currentImage.height}`);
            svg.style.cssText = `
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                cursor: move;
            `;
            
            // 清除之前的SVG
            const existing = previewContainer.querySelector('svg');
            if (existing) existing.remove();
            
            // 添加遮挡层
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const mask = document.createElementNS('http://www.w3.org/2000/svg', 'mask');
            mask.setAttribute('id', 'testMask');
            
            const maskRect1 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            maskRect1.setAttribute('width', currentImage.width);
            maskRect1.setAttribute('height', currentImage.height);
            maskRect1.setAttribute('fill', 'white');
            
            const maskRect2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            maskRect2.setAttribute('x', border.left);
            maskRect2.setAttribute('y', border.top);
            maskRect2.setAttribute('width', border.right - border.left);
            maskRect2.setAttribute('height', border.bottom - border.top);
            maskRect2.setAttribute('fill', 'black');
            
            mask.appendChild(maskRect1);
            mask.appendChild(maskRect2);
            defs.appendChild(mask);
            svg.appendChild(defs);
            
            // 绘制遮挡层
            const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            overlay.setAttribute('width', currentImage.width);
            overlay.setAttribute('height', currentImage.height);
            overlay.setAttribute('fill', 'rgba(0,0,0,0.4)');
            overlay.setAttribute('mask', 'url(#testMask)');
            svg.appendChild(overlay);
            
            // 绘制边界线
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', border.left);
            rect.setAttribute('y', border.top);
            rect.setAttribute('width', border.right - border.left);
            rect.setAttribute('height', border.bottom - border.top);
            rect.setAttribute('fill', 'none');
            rect.setAttribute('stroke', '#FF8C00');
            rect.setAttribute('stroke-width', '3');
            svg.appendChild(rect);
            
            // 添加四个角点
            const corners = [
                { x: border.left, y: border.top, label: 'TL' },
                { x: border.right, y: border.top, label: 'TR' },
                { x: border.right, y: border.bottom, label: 'BR' },
                { x: border.left, y: border.bottom, label: 'BL' }
            ];
            
            corners.forEach(corner => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', corner.x);
                circle.setAttribute('cy', corner.y);
                circle.setAttribute('r', '12');
                circle.setAttribute('fill', '#FF8C00');
                circle.setAttribute('stroke', 'white');
                circle.setAttribute('stroke-width', '2');
                circle.style.cursor = 'move';
                svg.appendChild(circle);
            });
            
            previewContainer.appendChild(svg);
        }
        
        // 显示状态消息
        function showStatus(msg, type = 'info') {
            statusMessage.innerHTML = msg;
            statusMessage.className = 'info-box ' + type;
            statusMessage.style.display = 'block';
        }
        
        // 显示结果
        function showResults(html) {
            results.innerHTML = html;
        }
    </script>
</body>
</html>
